user nginx;
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  log_format access '$remote_addr - $request_method $request_uri $status '
                    '$body_bytes_sent "$http_referer" rt=$request_time';
  access_log /var/log/nginx/access.log access;
  error_log  /var/log/nginx/error.log warn;

  # ─── Rate-limit zones (defence-in-depth on top of the app's own limiter) ──
  limit_req_zone $binary_remote_addr zone=chatapi:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=general:10m rate=60r/m;

  upstream chatbot {
    server api:8000;
    keepalive 16;
  }

  # ─── HTTP → HTTPS redirect ───────────────────────────────────────────────
  server {
    listen 80;
    server_name chatbot.kingdom24.in;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ─── HTTPS server ────────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    http2 on;
    server_name chatbot.kingdom24.in;

    # SSL — Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/chatbot.kingdom24.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatbot.kingdom24.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # CORS — kingdom24.in only
    set $cors_origin "";
    if ($http_origin ~* "^https://(www\.)?kingdom24\.in$") {
      set $cors_origin $http_origin;
    }
    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, X-API-Key, X-Conversation-ID" always;
    add_header Access-Control-Max-Age       86400 always;

    # Body size cap (matches application limit)
    client_max_body_size 10k;

    # Preflight
    if ($request_method = OPTIONS) {
      return 204;
    }

    # Chat API — strict rate limit
    location /api/chat {
      limit_req zone=chatapi burst=5 nodelay;
      limit_req_status 429;

      proxy_pass http://chatbot;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    # WhatsApp webhook (no rate limit — Twilio retries already throttle)
    location /webhook/ {
      limit_req zone=general burst=10 nodelay;

      proxy_pass http://chatbot;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    # Everything else — health, stats, history, widget
    location / {
      limit_req zone=general burst=20 nodelay;

      proxy_pass http://chatbot;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }
}
