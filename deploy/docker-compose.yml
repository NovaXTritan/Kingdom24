name: k24-chatbot

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: k24-chatbot
    restart: unless-stopped
    env_file: ../.env
    environment:
      ENV: production
      OLLAMA_BASE_URL: http://ollama:11434
      # If a website-catalogue snapshot is bind-mounted in (see optional
      # volume below), this points the loader at it. Falls back to the
      # 32-SKU seed if the file isn't present.
      PRODUCTS_JSON_PATH: /app/data/website_products.json
    volumes:
      # Persistent data: conversations, leads, alerts, daily-rotated logs,
      # daily backups. The application writes everything under storage/.
      - ../storage:/app/storage
      # OPTIONAL: 526-SKU website catalogue snapshot. If you scp/rsync the
      # website's products.json to /opt/kingdom24-web-data/products.json on
      # the host, the chatbot picks it up automatically.
      - /opt/kingdom24-web-data/products.json:/app/data/website_products.json:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      ollama:
        condition: service_started
    networks: [k24]

  ollama:
    image: ollama/ollama:latest
    container_name: k24-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks: [k24]
    # On first boot pull a small model. Subsequent runs use cached weights.
    entrypoint: >
      /bin/sh -c "ollama serve & sleep 4 && ollama pull llama3.1:8b 2>/dev/null || true && wait"

  nginx:
    image: nginx:alpine
    container_name: k24-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on: [api]
    networks: [k24]

volumes:
  ollama-models:

networks:
  k24:
