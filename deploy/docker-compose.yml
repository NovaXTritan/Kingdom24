name: k24-chatbot

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: k24-chatbot
    restart: unless-stopped
    env_file: ../.env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ../storage:/app/storage
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - ollama
    networks: [k24]

  ollama:
    image: ollama/ollama:latest
    container_name: k24-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks: [k24]
    # On first boot, pull a small model. Subsequent runs use the cached weights.
    entrypoint: >
      /bin/sh -c "ollama serve & sleep 4 && ollama pull llama3.1:8b 2>/dev/null || true && wait"

  nginx:
    image: nginx:alpine
    container_name: k24-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on: [api]
    networks: [k24]

volumes:
  ollama-models:

networks:
  k24:
